{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "nextgen.name" . }}
  labels: {{- include "nextgen.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: {{ .Values.ingress.tlsSecret }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # The API directly (webhooks, SCIM, SDK clients); everything else to the web app.
          - path: /api/v1
            pathType: Prefix
            backend: { service: { name: {{ include "nextgen.name" . }}-backend, port: { number: 4000 } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ include "nextgen.name" . }}-frontend, port: { number: 3000 } } }
{{- end }}
