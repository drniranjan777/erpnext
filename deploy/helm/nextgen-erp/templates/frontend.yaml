apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nextgen.name" . }}-frontend
  labels: {{- include "nextgen.labels" . | nindent 4 }}
    app.kubernetes.io/component: frontend
spec:
  replicas: {{ .Values.frontend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels: {{- include "nextgen.labels" . | nindent 8 }}
        app.kubernetes.io/component: frontend
    spec:
      securityContext: { runAsNonRoot: true }
      containers:
        - name: frontend
          # Built with BACKEND_URL=http://<release>-backend:4000 (the /api/v1 rewrite target).
          image: "{{ .Values.image.frontend }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe:
            httpGet: { path: /login, port: http }
            periodSeconds: 10
          resources: {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nextgen.name" . }}-frontend
  labels: {{- include "nextgen.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: frontend
  ports: [{ name: http, port: 3000, targetPort: http }]
{{- if .Values.frontend.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "nextgen.name" . }}-frontend
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ include "nextgen.name" . }}-frontend }
  minReplicas: {{ .Values.frontend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.frontend.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.frontend.autoscaling.targetCPU }} } }
{{- end }}
