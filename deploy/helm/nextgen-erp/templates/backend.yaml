apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "nextgen.name" . }}-storage
  labels: {{- include "nextgen.labels" . | nindent 4 }}
spec:
  accessModes: [{{ .Values.backend.storage.accessMode }}]
  {{- if .Values.backend.storage.storageClass }}
  storageClassName: {{ .Values.backend.storage.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.backend.storage.size }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nextgen.name" . }}-backend
  labels: {{- include "nextgen.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels: {{- include "nextgen.labels" . | nindent 8 }}
        app.kubernetes.io/component: backend
    spec:
      securityContext: { runAsNonRoot: true, fsGroup: 101 }
      containers:
        - name: backend
          image: "{{ .Values.image.backend }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 4000 }]
          env: {{- include "nextgen.env" . | nindent 12 }}
          envFrom:
            - secretRef: { name: {{ .Values.existingSecret }} }
          readinessProbe:
            httpGet: { path: /api/v1/health/ready, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/v1/health/live, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources: {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: false, capabilities: { drop: [ALL] } }
          volumeMounts:
            - { name: storage, mountPath: /data/storage }
      volumes:
        - name: storage
          persistentVolumeClaim: { claimName: {{ include "nextgen.name" . }}-storage }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nextgen.name" . }}-backend
  labels: {{- include "nextgen.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: backend
  ports: [{ name: http, port: 4000, targetPort: http }]
{{- if .Values.backend.autoscaling.enabled }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "nextgen.name" . }}-backend
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: {{ include "nextgen.name" . }}-backend }
  minReplicas: {{ .Values.backend.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.backend.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: {{ .Values.backend.autoscaling.targetCPU }} } }
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "nextgen.name" . }}-backend
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
